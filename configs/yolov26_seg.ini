# =============================================================================
#  trt_alpha :: yolov26_seg（实例分割，nc = 80，mask 系数 32）
# -----------------------------------------------------------------------------
#  引擎是外部导出的静态 ONNX（batch = 2，输入 3x640x640，两个输出）：
#      output0 [2, 116, 8400]      4(xywh) + nc(80) + 32(mask 系数)
#      output1 [2, 32, 160, 160]   mask prototype（1/4 分辨率）
#  本仓库不存引擎文件，engines/ 下的名字只是约定；实际用 --engine 指过去：
#      D:\ThirdParty\TensorRT-10.16.1.11\bin\yolo26n-seg.trt
#
#  output0 已烘焙 dist2bbox / *stride / sigmoid。C++ 只剩：conf 过滤 + NMS +
#  process_mask。掩码按**官方当前顺序**做（ultralytics/utils/ops.py::process_mask
#  的 upsample=True 分支）：
#      logits(160x160) = 系数·proto            <- CvMaskCoeffDotPlan
#      -> bilinear 上采样到 640x640            <- CvScaleMaskPlan<float>
#      -> >0 二值化 -> 按框裁剪（右/下严格小于）-> 全零则丢弃
#
#  ⚠️ 掩码停在**网络输入分辨率**（640x640，含 letterbox 灰边），不是源图尺寸 ——
#  这和官方 Results.masks 的位置一致（渲染时才由 Annotator.masks 插值到图像大小）。
#  要叠回原图，用**同一个 LetterBoxInfo**裁/缩即可。
#
#  ⚠️ 顺序陷阱：老版本是「先在 160 上裁框、再 resize」，本仓库的 yolov8_seg 用的
#  就是那个顺序；当前版本改成「先上采样、再裁框」（上游 #24272）。本模型复刻当前版本。
#
#  mask_orig：是否额外产出**原图尺寸**的掩码（Segmentation::maskOrig）。默认关 ——
#  它是每个实例一次 640->原图 的双线性 resize（1912x1080 上约 0.6 ms/实例），而内置
#  renderer 根本不用它（它自己拿 640x640 的 mask 重缩）。只有你要把 mask 直接喂给
#  别的后处理时才打开。
# =============================================================================

[model]
engine = engines/yolov26n_seg.trt
class_names_file = data/classes/coco80.txt
input_output_names = images,output0,output1
num_class = 80
extra = 32
mask_orig = false

[input]
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
#top_k = 300
top_k = 100

[render]
# 实例分割掩码混合 alpha：与上游 Annotator.masks 默认 alpha 对齐（0.5）。
mask_alpha = 0.5
