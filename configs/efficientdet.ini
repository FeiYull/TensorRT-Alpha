[model]
engine = engines/efficientdet0.trt
class_names_file = data/classes/coco91.txt
input_output_names = input,num_detections,detection_boxes,detection_scores,detection_classes
num_class = 91

[input]
# efficientdet 是 NHWC（[B, H, W, 3]），与 yolo 系相反，故显式声明。
layout = nhwc
# H/W 焊死在引擎里（d0/d1/d2/d3 = 512/640/768/896），无需配置：
# 以引擎声明形状为唯一真相源，配置不符只告警并按引擎纠正。

[postprocess]
conf_thresh = 0.45