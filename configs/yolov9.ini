# =============================================================================
#  trt_alpha :: yolov9（目标检测）
# -----------------------------------------------------------------------------
#  【新实现】走 YOLOV26 的 fused 前后处理（继承 YoloV26，只改标签）。
#  yolov9 的 GELAN / Silence 只影响主干与层名，不改变输出契约。
#
#  引擎：engines/yolov9t.trt（静态 batch = 2，输入 3x640x640）
#      yolo export model=yolov9t.pt format=onnx imgsz=640 batch=2 opset=17
#      trtexec --onnx=yolov9t.onnx --saveEngine=engines/yolov9t.trt --noTF32
#
#  输出契约（实测与 yolo26n.onnx 逐项相同）：
#      output0 [B, 4 + nc, anchors] = [B, 84, 8400]，box 是 xywh 像素，
#      cls 已 sigmoid。dist2bbox / *stride 都烘焙进图里了。
#
#  ⚠️ 分辨率：det 是 640。yolov9 官方只发 yolov9t/s/m/c/e，seg 只有 c/e，
#      所以 det 用 t，seg 用 c（见 configs/yolov9_seg.ini）。
# =============================================================================

[model]
engine = engines/yolov9t.trt
class_names_file = data/classes/coco80.txt
num_class = 80

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
# 静态引擎的 batch 已烘焙进图（导出 ONNX 时 batch=2），必须写对。
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300
