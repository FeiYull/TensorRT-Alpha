# =============================================================================
#  trt_alpha :: yolov26_pose（人体关键点，nc = 1，kpt = 17）
# -----------------------------------------------------------------------------
#  引擎是外部导出的静态 ONNX（batch = 2，输入 3x640x640，输出 [2, 56, 8400]）。
#  本仓库不存引擎文件，engines/ 下的名字只是约定；实际用 --engine 指过去：
#      D:\ThirdParty\TensorRT-10.16.1.11\bin\yolo26n-pose.trt
#
#  输出通道 = 4(xywh) + nc(1) + 17*3(置信度 x y) = 56，已烘焙 dist2bbox /
#  *stride / sigmoid / kpts_decode。C++ 只剩：conf 过滤 + NMS +
#  scale_boxes / scale_coords。
#
#  [model] 里【不写 extra】—— 它由 num_kpts*3 推导（17*3 = 51）。两个必须互相
#  一致的键就是静默漂移的来源，这个仓库不接受。
# =============================================================================

[model]
engine = engines/yolov26n_pose.trt
class_names_file = data/classes/person.txt
input_output_names = images,output0
num_class = 1
num_kpts = 17

[input]
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300

[render]
# 关键点置信度阈值：低于此值的关键点不画点、不连骨架。
# 与上游 Annotator.kpts 的默认 conf_thres 对齐（0.25），不是推理阈值。
kpt_conf_thresh = 0.25
