# =============================================================================
#  trt_alpha :: 公共配置（所有模型共享）
# -----------------------------------------------------------------------------
#  此文件被 configs/<model>.ini 继承。
#  同名字段：<model>.ini 覆盖 base.ini。
# =============================================================================

[input]
dst_h = 640
dst_w = 640
batch_size = 1

[normalize]
scale = 255.0
mean = 0.0,0.0,0.0
std = 1.0,1.0,1.0
pad_value = 114.0

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.45
top_k = 300

[pool]
workers = 1
device_id = 0
max_queue_size = 16
result_queue_size = 32
policy = DropOldest

[output]
save_dir = save
show_window = trt_alpha

[kernels]
block_2d_x = 8
block_2d_y = 8
block_1d = 256