# =============================================================================
#  trt_alpha :: 公共配置（所有模型共享）
# -----------------------------------------------------------------------------
#  此文件被 configs/<model>.ini 继承。
#  同名字段：<model>.ini 覆盖 base.ini。
# =============================================================================

[input]
# 输入【逻辑维序】：nchw / nhwc / ncdhw / ndhwc / chw / hwc …（不区分大小写）。
# 一般不用写 —— 模型自带规范布局（yolo 系 = NCHW，efficientdet = NHWC）。
# 仅当同一个模型换上布局不同的引擎时才需要覆盖。
# layout = nchw

# 本次推理实际使用的 batch（运行时按引擎真实能力自动校正）。
#   * 静态引擎（onnx 固定 batch）  ：会被纠正为该固定值，并告警。
#   * 动态引擎（onnx=-1 + trtexec min/opt/max）：clamp 到 [min, max]；超上界告警、越下界报错。
batch_size = 1
# 可选：声明的引擎 batch 上界契约。与引擎实际值不符 → 启动即报错。
# 不写（或写 <=0）表示不做该校验，完全以引擎 profile 为准。
# max_batch_size = 4

# 空间维（H/W）无需配置：一律以【引擎声明形状】为唯一真相源，不符只告警。
# 仅当引擎该维是动态维（-1）时，下面两项才作为"意图值"生效。
# dst_h = 640
# dst_w = 640

[normalize]
scale = 255.0
mean = 0.0,0.0,0.0
std = 1.0,1.0,1.0
pad_value = 114.0

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.45
top_k = 300

[pool]
workers = 1
device_id = 0
max_queue_size = 16
result_queue_size = 32
policy = DropOldest

[output]
save_dir = save
show_window = trt_alpha

[kernels]
block_2d_x = 8
block_2d_y = 8
block_1d = 256