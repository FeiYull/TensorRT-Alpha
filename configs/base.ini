# =============================================================================
#  trt_alpha :: 公共配置（所有模型共享）
# -----------------------------------------------------------------------------
#  此文件被 configs/<model>.ini 继承。
#  同名字段：<model>.ini 覆盖 base.ini。
# =============================================================================

[input]
# 输入【逻辑维序】：nchw / nhwc / ncdhw / ndhwc / chw / hwc …（不区分大小写）。
# 每个 configs/<model>.ini 已经在自己的 [input] 段显式写出真实取值
#    （yolo 系 / u2net / yunet = nchw，efficientdet = nhwc）。
# 这一份是【全局兜底】：只有模型 INI 里没写时才轮到它。
# 优先级：模型 INI 的 input.layout > base.ini 的 input.layout > 代码里的规范布局。
# 仅当同一个模型换上【布局不同】的引擎时才需要改它。
# layout = nchw

# 本次推理实际使用的 batch（必须是 > 0 的整数；引擎 profile 为唯一真相源）。
#   * 静态引擎（onnx 固定 batch）  ：必须等于引擎写死的值，否则 ERROR + 终止。
#   * 动态引擎（onnx=-1 + trtexec min/opt/max）：必须落在 [min, max] 内；
#     超上界 / 低于下界 → ERROR + 终止（不静默钳制）。
# 报错会直接给出引擎【要求的 batch】（静态）或【最大 batch】（动态），
# 按提示改这里即可，或用 --batch <n> 覆盖。
batch_size = 1
# 可选：声明的引擎 batch 上界契约。与引擎实际值不符 → 启动即报错。
# 不写（或写 <=0）表示不做该校验，完全以引擎 profile 为准。
# max_batch_size = 4

# 空间维（H/W）无需配置：一律以【引擎声明形状】为唯一真相源，不符只告警。
# 仅当引擎该维是动态维（-1）时，下面两项才作为"意图值"生效。
# dst_h = 640
# dst_w = 640

[normalize]
# scale 对所有模型都生效。
# mean / std 只有"老预处理"那条路的模型真正应用：
#   yolov3 / yolov4 / yolov5 / yolov6 / yolov7 / yolov8 / yolox / yolor /
#   yolo_nas / yolov8_pose / yolov8_seg / u2net
# 其余模型（yolov26 与 yolov11 的 det/seg/pose/cls/obb，加 depth / sem）走的是
# fused 预处理核，只有 divisor 一个系数位；给它们写非 0/1 的 mean/std 会在启动
# 时直接报错（不会静默失效 —— 静默失效正是这个配置框要防的事）。
scale = 255.0
mean = 0.0,0.0,0.0
std = 1.0,1.0,1.0
pad_value = 114.0

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.45
top_k = 300

# 渲染/显示参数【不放这里】：pose 的关键点阈值、seg 的掩码 alpha 等是"按模型"
# 的参数，默认值因任务而异。写在 <model>.ini 的 [render] 节（如
# yolov26_pose.ini 的 kpt_conf_thresh、yolov26_seg.ini 的 mask_alpha）。

[pool]
# 推理池 worker 数 = "1 engine + N context"。CLI --workers 可覆盖。
# 每多一个 worker 就多一次引擎上下文与一份显存，按吞吐需求调。
workers = 1

# 推理池【任务队列】上限（每项 = 一个 batch）。满时阻塞（Block），
# 即对上游反压 —— 推理任务不能丢。必须 > 0（<=0 会被退回默认 16）。
max_queue_size = 4

# 结果队列上限（Pipeline 内，每项 = 一个 batch 的结果）。
# 满时丢最旧（DropOldest）—— 实时显示场景宁可丢帧也要跟上。必须 > 0。
result_queue_size = 8

# 渲染线程数。0 = auto（只落盘时按 CPU 核数取 1~8；--show 恒为 1）。
# 只影响 --save 的编码并行度，不影响推理。32 线程机器实测（同一段视频落盘）：
# 4 → 21.2 s，6 → 16.0 s，8 → 16.2 s，16 → 18.8 s（无 --save 基线 15.0 s）。
# 🔴 必须写在本 [pool] 段下：键是按 "段名.键名" 查的，写到别的段会存成
#    output.render_threads 之类而静默失效（配置框里会标 [unused] 提示）。
# render_threads = 0
render_threads = 6

# --- 以下为保留项：当前版本未接入，写了【不生效】（框里会标 [unused]）---
# device_id = 0            # 多卡选择：当前恒用 0 号卡
# policy    = DropOldest   # 队列策略：按队列固定（任务=Block / 结果=DropOldest），
#                          # 不暴露为单一开关，避免语义歧义

[output]
# 存盘目录（可选）。留空 = 默认 save/<模型名>，例如 save/yolov8。
# CLI --save <dir> 优先（写了就原样使用，不再拼模型名子目录）。
# 显式写值同样原样使用。
# save_dir =
# 显示窗口名。仅 --show 时使用。
# 不写 = 默认 "trt_alpha:<模型注册名>"（例如 trt_alpha:yolov26），这样同时
# --show 多个模型时窗口不会互相覆盖。显式写值则原样使用（不拼后缀）。
# show_window = trt_alpha

# 落盘 JPEG 质量 1..100（默认 95 = OpenCV 默认值）。只影响 --save 的 .jpg。
# q85 体积减 41%（738 → 432 KB/帧），耗时不变 —— 多线程下编码已不是瓶颈。
jpeg_quality = 95

# --- 以下为保留项：自定义 kernel 启动参数，当前版本未接入（写了不生效）---
# [kernels]
# block_2d_x = 8
# block_2d_y = 8
# block_1d   = 256
