# =============================================================================
#  trt_alpha :: 公共配置（所有模型共享）
# -----------------------------------------------------------------------------
#  此文件被 configs/<model>.ini 继承。
#  同名字段：<model>.ini 覆盖 base.ini。
# =============================================================================

[source]
# ---- 解码 ----
# 视频用哪个库解码：opencv / ffmpeg / auto
#   opencv = cv::VideoCapture（默认；行为与未接入 FFmpeg 之前一致）
#   ffmpeg = libavformat + libavcodec（需带 FFmpeg 编译，否则启动报错）
#   auto   = 构建带 FFmpeg 就用它，否则回落 OpenCV
# 图片 / 图片目录 / 摄像头恒走 OpenCV，与本项无关。
# 优先级：CLI --decode > 本项 > 代码默认。
decode = opencv

# FFmpeg 后端的硬解偏好：auto / none / nvdec（decode=opencv 时忽略）
#   auto  = 能硬解就 NVDEC，不行静默回落软解
#   none  = libavcodec 纯 CPU 软解
#   nvdec = 强制 NVDEC，不可用直接报错（不静默降级）
# 优先级：CLI --hwaccel > 本项 > 代码默认。
hwaccel = auto

# 流打开 / 单次读取超时（毫秒，仅 URL 流 + FFmpeg 后端）。
# <= 0 = 交给后端默认（不设上限，不可达的流会长时间阻塞）。
open_timeout_ms = 5000
read_timeout_ms = 5000

# ---- 帧回拷 ----
# 每帧解码后是否把像素拷回主机内存：auto / on / off
#   auto = 只有"真有人读主机像素"时才拷（要渲染 或 模型不支持显存直通）← 默认
#   on   = 总是拷（源码里要拿 Frame::image() 就必须它）
#   off  = 总不拷，像素留在显存。NVDEC 1080p 每帧省 6.2 MB 的 D2H
#          （实测 0.475 ms / 帧，约 22%）。此时 Frame::image() / rendered()
#          返回空视图，检测 / mask / depth 结果不受影响。
#   注意：off 与"要渲染"或"模型不支持显存像素"互斥，那种组合启动即报错
#         （不会静默改成 on）；用 opencv 后端时本项无效（软解没有显存退路）。
# 优先级：CLI --host-copy > 本项 > 代码默认。
need_host_copy = auto

[input]
# 输入【逻辑维序】：nchw / nhwc / ncdhw / ndhwc / chw / hwc …（不区分大小写）。
# 每个 configs/<model>.ini 已经在自己的 [input] 段显式写出真实取值
#    （yolo 系 / u2net / yunet = nchw，efficientdet = nhwc）。
# 这一份是【全局兜底】：只有模型 INI 里没写时才轮到它。
# 优先级：模型 INI 的 input.layout > base.ini 的 input.layout > 代码里的规范布局。
# 仅当同一个模型换上【布局不同】的引擎时才需要改它。
# layout = nchw

# 本次推理实际使用的 batch（必须是 > 0 的整数；引擎 profile 为唯一真相源）。
#   * 静态引擎（onnx 固定 batch）  ：必须等于引擎写死的值，否则 ERROR + 终止。
#   * 动态引擎（onnx=-1 + trtexec min/opt/max）：必须落在 [min, max] 内；
#     超上界 / 低于下界 → ERROR + 终止（不静默钳制）。
# 报错会直接给出引擎【要求的 batch】（静态）或【最大 batch】（动态），
# 按提示改这里即可，或用 --batch <n> 覆盖。
batch_size = 1
# 可选：声明的引擎 batch 上界契约。与引擎实际值不符 → 启动即报错。
# 不写（或写 <=0）表示不做该校验，完全以引擎 profile 为准。
# max_batch_size = 4

# 空间维（H/W）无需配置：一律以【引擎声明形状】为唯一真相源，不符只告警。
# 仅当引擎该维是动态维（-1）时，下面两项才作为"意图值"生效。
# dst_h = 640
# dst_w = 640

[normalize]
# scale 对所有模型都生效。
# mean / std 只有"老预处理"那条路的模型真正应用：
#   yolov3 / yolov4 / yolov5 / yolov6 / yolov7 / yolov8_old / yolox / yolor /
#   yolo_nas / yolov8_pose_old / yolov8_seg_old / u2net
# 其余模型（yolov26 与 yolov11 的 det/seg/pose/cls/obb，加 depth / sem）走的是
# fused 预处理核，只有 divisor 一个系数位；给它们写非 0/1 的 mean/std 会在启动
# 时直接报错（不会静默失效 —— 静默失效正是这个配置框要防的事）。
scale = 255.0
mean = 0.0,0.0,0.0
std = 1.0,1.0,1.0
pad_value = 114.0

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.45
top_k = 300

# 渲染/显示参数【不放这里】：pose 的关键点阈值、seg 的掩码 alpha 等是"按模型"
# 的参数，默认值因任务而异。写在 <model>.ini 的 [render] 节（如
# yolov26_pose.ini 的 kpt_conf_thresh、yolov26_seg.ini 的 mask_alpha）。

[pool]
# 推理池 worker 数 = "1 engine + N context"。CLI --workers 可覆盖。
# 每多一个 worker 就多一次引擎上下文与一份显存，按吞吐需求调。
workers = 1

# 推理池【任务队列】上限（每项 = 一个 batch）。必须 > 0（<=0 会被退回默认 16）。
max_queue_size = 4

# 任务队列【满时策略】。固定 block：满时对上游反压（source 线程暂停解码）。
# 🔴 推理任务不能丢 —— 丢掉一个任务，它对应的 future 永不 resolve，渲染线程
#   会永久卡死在 future.get()。所以这里只有 block 一个合法值，不提供 drop。
task_queue_policy = block

# 结果队列上限（Pipeline 内，每项 = 一个 batch 的结果）。必须 > 0。
result_queue_size = 8

# 结果队列【满时策略】：block / drop_oldest / drop_newest / auto。
#   block       = 满时反压（批处理不丢帧）
#   drop_oldest = 丢最旧（实时显示宁可丢帧也要跟上）
#   drop_newest = 丢最新（保守，宁缺勿滥）
#   auto        = 按源类型：实时源（摄像头/流）drop_oldest，离线源（文件）block
# 仅在这里改；命令行等入口不支持覆盖。
queue_full_policy = auto

# 渲染线程数。0 = auto（只落盘时按 CPU 核数取 1~8；--show 恒为 1）。
# 只影响 --save 的编码并行度，不影响推理。32 线程机器实测（同一段视频落盘）：
# 4 → 21.2 s，6 → 16.0 s，8 → 16.2 s，16 → 18.8 s（无 --save 基线 15.0 s）。
# 🔴 必须写在本 [pool] 段下：键是按 "段名.键名" 查的，写到别的段会存成
#    output.render_threads 之类而静默失效（配置框里会标 [unused] 提示）。
# render_threads = 0
render_threads = 6

# --- 以下为保留项：当前版本未接入，写了【不生效】（框里会标 [unused]）---
# device_id = 0            # 多卡选择：当前恒用 0 号卡

[output]
# 存盘目录（可选）。留空 = 默认 save/<模型名>，例如 save/yolov8_old。
# CLI --save <dir> 优先（写了就原样使用，不再拼模型名子目录）。
# 显式写值同样原样使用。
# save_dir =
# 显示窗口名。仅 --show 时使用。
# 不写 = 默认 "trt_alpha:<模型注册名>"（例如 trt_alpha:yolov26），这样同时
# --show 多个模型时窗口不会互相覆盖。显式写值则原样使用（不拼后缀）。
# show_window = trt_alpha

# 落盘 JPEG 质量 1..100（默认 95 = OpenCV 默认值）。只影响 --save 的 .jpg。
# q85 体积减 41%（738 → 432 KB/帧），耗时不变 —— 多线程下编码已不是瓶颈。
jpeg_quality = 95

# --- 以下为保留项：自定义 kernel 启动参数，当前版本未接入（写了不生效）---
# [kernels]
# block_2d_x = 8
# block_2d_y = 8
# block_1d   = 256
