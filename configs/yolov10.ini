# =============================================================================
#  trt_alpha :: yolov10（目标检测）
# -----------------------------------------------------------------------------
#  【新实现】走 YOLOV26 的 fused 前后处理（继承 YoloV26，只改标签）。
#
#  ⚠️⚠️ 只有 one2many 导出能用。yolov10 有两套互不兼容的 ONNX：
#      (A) one2many  [B, 4 + nc, anchors] = [B, 84, 8400]   <-- 本配置
#      (B) end2end   [B, 300, 6]（xyxy, conf, cls，NMS 在图里）
#  ultralytics 8.4.165 的 `yolo export` 导出的是 (A)：Detect.fuse() 删掉
#  one2one_cv2 之后 end2end property 恒为 False。官方 release 的 onnx 是 (B)。
#  误用 (B) 不会静默算错 —— expectC = 4 + nc + extra 检查会在启动时报
#  300 != 84 然后退出。要用 (B) 得另写 top-k 解析，不是复用。
#
#  引擎：engines/yolov10n.trt（静态 batch = 2，输入 3x640x640）
#      yolo export model=yolov10n.pt format=onnx imgsz=640 batch=2 opset=17
#      trtexec --onnx=yolov10n.onnx --saveEngine=engines/yolov10n.trt --noTF32
#
#  输出契约（one2many，实测与 yolo26n.onnx 逐项相同）：
#      output0 [B, 84, 8400]，box 是 xywh 像素，cls 已 sigmoid。
#
#  ⚠️ 分辨率：det 是 640。
# =============================================================================

[model]
engine = engines/yolov10n.trt
class_names_file = data/classes/coco80.txt
num_class = 80

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
# 静态引擎的 batch 已烘焙进图（导出 ONNX 时 batch=2），必须写对。
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300
