# =============================================================================
#  trt_alpha :: yolov8_seg（实例分割，nc = 80，mask 系数 32）
# -----------------------------------------------------------------------------
#  【新实现】走 YOLOV26 的 fused 前后处理（继承 YoloV26Seg）。
#  老的动态引擎已改名 engines/yolov8n_seg_old.trt，两个实现可直接 A/B 对拍。
#
#  引擎：engines/yolov8n_seg.trt（静态 batch = 2，输入 3x640x640）
#      yolo export model=yolov8n-seg.pt format=onnx imgsz=640 batch=2 opset=17
#      trtexec --onnx=yolov8n-seg.onnx --saveEngine=engines/yolov8n_seg.trt --noTF32
#
#  两个输出（实测与 yolo26n-seg.onnx 逐项相同）：
#      output0 [B, 116, 8400]     4(xywh) + nc(80) + 32(mask 系数)
#      output1 [B, 32, 160, 160]  mask prototype（1/4 分辨率）
#
#  ⚠️ 掩码顺序：本实现按上游新口径「先 bilinear 上采样到 640，再按框裁剪」。
#     旧的 yolov8_seg_old 是「先裁后缩」，两者在 mask 边界会有 1~2 px 差异，
#     这是已知的实现分叉，不是 bug。
# =============================================================================

[model]
engine = engines/yolov8n_seg.trt
class_names_file = data/classes/coco80.txt
input_output_names = images,output0,output1
num_class = 80
extra = 32
# 是否额外产出原图尺寸的掩码（Segmentation::maskOrig）。默认关：每实例一次
# 全分辨率 resize，而内置 renderer 不用它。
mask_orig = false

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300

[render]
# 实例分割掩码混合 alpha：与上游 Annotator.masks 默认 alpha 对齐（0.5）。
mask_alpha = 0.5
