# =============================================================================
#  trt_alpha :: yolov11_obb（旋转框检测 / DOTA v1，nc = 15）
# -----------------------------------------------------------------------------
#  引擎：engines/yolov11n_obb.trt（yolo11n-obb.onnx @1024，静态 batch = 2）
#      yolo export model=yolo11n-obb.pt format=onnx imgsz=1024 batch=2 opset=17 simplify=True
#      trtexec --onnx=yolo11n-obb.onnx --saveEngine=engines/yolov11n_obb.trt --noTF32
#
#  1024 是 yolo11n-obb.pt 的原生 imgsz（DOTA 训练口径）。空间维**不写在本文件
#  里** —— 只认引擎声明形状。不写就一行日志都不会多；只有显式写了
#  input.dst_h / dst_w 且与引擎不符时，才会打那行
#      InputShape: config size 640x640 != engine declared shape ...
#  它只是 WARN，不是错误：引擎形状永远胜出。
#
#  output0 [2, 20, 21504] = 4(xywh) + nc(15) + 1(angle)，dist2rbox 已烘焙。
#  实测 centre <= 3.1e-5 px、angle <= 2.7e-7 rad。
#
#  坐标还原对齐官方 scale_boxes(..., xywh=True)：cx/cy 先减 pad 再除 gain，
#  w/h 只除 gain，**不做 clip**（只有 xyxy 分支才 clip）。
#  NMS 走 Fast-NMS(probiou)，不是贪心 —— 由 YoloV26Obb 保证，子类不碰。
# =============================================================================

[model]
engine = engines/yolov11n_obb.trt
class_names_file = data/classes/dota15.txt
num_class = 15
# 每 anchor 的额外通道：OBB 只有 1 个（旋转角）。
#     4(xywh) + 15(cls) + 1(angle) = 20
extra = 1

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300
