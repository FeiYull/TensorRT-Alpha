# =============================================================================
#  trt_alpha :: yolov11_cls（图像分类）
# -----------------------------------------------------------------------------
#  引擎：engines/yolov11n_cls.trt（yolo11n-cls.onnx @224，静态 batch = 2）
#      yolo export model=yolo11n-cls.pt format=onnx imgsz=224 batch=2 opset=17 simplify=True
#      trtexec --onnx=yolo11n-cls.onnx --saveEngine=engines/yolov11n_cls.trt --noTF32
#
#  预处理是 Pillow 口径 —— Resize(短边 -> 224, PIL BILINEAR) -> CenterCrop(224)，
#  **不是 letterbox**；长边用 int() 截断（810x1080 -> 224x298）。
#  后处理：output0 [batch, 1000] 已含 Softmax，C++ 只做 top-k。
#
#  为什么必须是 224：分类缩的是短边，224 和 640 是完全不同的输入。官方分类
#  参考也是 224，引擎按 224 导才对得上。
# =============================================================================

[model]
engine = engines/yolov11n_cls.trt
class_names_file = data/classes/imagenet1000.txt
input_output_names = images,output0
num_class = 1000

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
batch_size = 2

[postprocess]
# 分类只取前 top_k 个类别。
top_k = 5
