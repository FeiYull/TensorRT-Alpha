# =============================================================================
#  trt_alpha :: yolov8_pose（人体关键点，nc = 1，kpt = 17）
# -----------------------------------------------------------------------------
#  【新实现】走 YOLOV26 的 fused 前后处理（继承 YoloV26Pose）。
#  老的动态引擎已改名 engines/yolov8n_pose_old.trt，两个实现可直接 A/B 对拍。
#
#  引擎：engines/yolov8n_pose.trt（静态 batch = 2，输入 3x640x640）
#      yolo export model=yolov8n-pose.pt format=onnx imgsz=640 batch=2 opset=17
#      trtexec --onnx=yolov8n-pose.onnx --saveEngine=engines/yolov8n_pose.trt --noTF32
#
#  输出契约（实测与 yolo26n-pose.onnx 逐项相同）：
#      output0 [B, 56, 8400] = 4(xywh) + nc(1) + 17*3(x, y, conf)
#      dist2bbox / kpts_decode 已烘焙进图。
#
#  [model] 里【不写 extra】—— 它由 num_kpts*3 推导（17*3 = 51）。
# =============================================================================

[model]
engine = engines/yolov8n_pose.trt
class_names_file = data/classes/person.txt
input_output_names = images,output0
num_class = 1
num_kpts = 17

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300

[render]
# 关键点置信度阈值：低于此值的关键点不画点、不连骨架。
# 与上游 Annotator.kpts 的默认 conf_thres 对齐（0.25），不是推理阈值。
kpt_conf_thresh = 0.25
