# =============================================================================
#  trt_alpha :: yolo11_pose（人体关键点，nc = 1，kpt = 17）
# -----------------------------------------------------------------------------
#  引擎：engines/yolo11n_pose.trt（yolo11n-pose.onnx @640，静态 batch = 2）
#      yolo export model=yolo11n-pose.pt format=onnx imgsz=640 batch=2 opset=17 simplify=True
#      trtexec --onnx=yolo11n-pose.onnx --saveEngine=engines/yolo11n_pose.trt --noTF32
#
#  output0 [2, 56, 8400] = 4(xywh) + nc(1) + 17*3(置信度, x, y)，decode 已烘焙。
#  C++ 只剩：conf 过滤 + NMS + scale_boxes / scale_coords。
#  实测 box/kpt <= 3.4e-4 px、conf <= 1.8e-7。
#
#  [model] 里【不写 extra】—— 由 num_kpts*3 推导（17*3 = 51）。两个必须互相
#  一致的键就是静默漂移的来源。
# =============================================================================

[model]
engine = engines/yolo11n_pose.trt
class_names_file = data/classes/person.txt
input_output_names = images,output0
num_class = 1
num_kpts = 17

[input]
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300

[render]
# 关键点置信度阈值：低于此值不画点、不连骨架（上游 Annotator.kpts 默认 0.25）。
kpt_conf_thresh = 0.25
