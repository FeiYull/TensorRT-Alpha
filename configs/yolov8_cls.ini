# =============================================================================
#  trt_alpha :: yolov8_cls（图像分类）
# -----------------------------------------------------------------------------
#  【新实现】走 YOLOV26 的 fused 前后处理（继承 YoloV26Cls）。
#
#  引擎：engines/yolov8n_cls.trt（静态 batch = 2，输入 3x224x224）
#      yolo export model=yolov8n-cls.pt format=onnx imgsz=224 batch=2 opset=17
#      trtexec --onnx=yolov8n-cls.onnx --saveEngine=engines/yolov8n_cls.trt --noTF32
#
#  预处理：Resize(短边 -> 224) -> CenterCrop(224) -> BGR2RGB -> /255。
#          **不是 letterbox**，所以这里绝不能按 640 的几何去算。
#  后处理：output0 = [B, 1000]，图里已含 Softmax，C++ 只需 top-k。
#
#  ⚠️ 分辨率：cls 是 224（短边缩放 + 中心裁剪），与 det/seg/pose 的 640 不同。
# =============================================================================

[model]
engine = engines/yolov8n_cls.trt
class_names_file = data/classes/imagenet1000.txt
num_class = 1000

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
# 静态引擎写死的 batch，必须与引擎一致（否则 init 直接报错）。
batch_size = 2

[postprocess]
# 分类只取前 top_k 个类别。
top_k = 5
