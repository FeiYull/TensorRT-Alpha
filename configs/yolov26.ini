[model]
engine = engines/yolov26n.trt
class_names_file = data/classes/coco80.txt
input_output_names = images,output0
num_class = 80
# extra: 每 anchor 的额外通道（seg = 32 / pose = 51）。det 用 0。
# extra = 0

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
# YOLOV26 的引擎是静态 batch 的（导出 ONNX 时把 batch 写死了），
# 所以这里必须与引擎一致，否则 init 直接报错（不会静默钳制）。
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300
