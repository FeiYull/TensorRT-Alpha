# =============================================================================
#  trt_alpha :: yolov11_seg（实例分割，nc = 80，mask 系数 32）
# -----------------------------------------------------------------------------
#  引擎：engines/yolov11n_seg.trt（yolo11n-seg.onnx @640，静态 batch = 2）
#      yolo export model=yolo11n-seg.pt format=onnx imgsz=640 batch=2 opset=17 simplify=True
#      trtexec --onnx=yolo11n-seg.onnx --saveEngine=engines/yolov11n_seg.trt --noTF32
#
#  两个输出：
#      output0 [2, 116, 8400]      4(xywh) + nc(80) + 32(mask 系数)
#      output1 [2, 32, 160, 160]   mask prototype（1/4 分辨率）
#
#  掩码按上游当前顺序做（process_mask 的 upsample=True 分支）：
#      系数·proto(160x160) -> bilinear 上采样到 640x640 -> >0 二值化
#      -> 按框裁剪（右/下严格小于）-> 全零则丢弃
#  实测 8 张混尺寸图与 onnxruntime 参考逐像素 0 差异。
#
#  ⚠️ 掩码停在**网络输入分辨率**（640x640，含灰边），不是源图尺寸 —— 与官方
#  Results.masks 的位置一致；要叠回原图，用同一个 LetterBoxInfo 裁/缩。
# =============================================================================

[model]
engine = engines/yolov11n_seg.trt
class_names_file = data/classes/coco80.txt
num_class = 80
extra = 32
# 是否额外产出原图尺寸的掩码（Segmentation::maskOrig）。默认关：每实例一次
# 全分辨率 resize，而内置 renderer 不用它。详见 configs/yolov26_seg.ini 顶部说明。
mask_orig = false

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300

[render]
# 掩码混合 alpha：与上游 Annotator.masks 默认值对齐（0.5）。
mask_alpha = 0.5
