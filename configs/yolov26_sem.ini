# =============================================================================
#  trt_alpha :: yolov26_sem（语义分割 / Cityscapes，nc = 19）
# -----------------------------------------------------------------------------
#  引擎是外部导出的静态 ONNX（batch = 2，输入 3x1024x1024，输出 [2, 1024, 1024]）。
#  本仓库不存引擎/权重（都被 gitignore），engines/ 下的名字只是约定：
#      onnx : E:\Code\ultralytics\yolo26n-sem.onnx      (imgsz = 1024)
#      build: trtexec --onnx=yolo26n-sem.onnx \
#                     --saveEngine=engines/yolov26n_sem.trt --noTF32
#
#  1024 是 yolo26n-sem.pt 的原生 imgsz（Cityscapes 训练口径）。空间维**不写在本
#  文件里** —— 只认引擎声明形状。不写就一行日志都不会多；只有显式写了
#  input.dst_h / dst_w 且与引擎不符时，才会打一行
#      InputShape: config size 640x640 != engine declared shape,
#                  using engine shape (1024x1024)
#  这行 WARN 不是错误：引擎形状永远胜出（ADR-2）。
#
#  ⚠️ 对拍时还有一处分叉是 **分辨率**：.pt 自带 imgsz=1024，不显式传 imgsz 就是
#     在 1024 上推理。py 侧对拍请写 model(..., rect=False, imgsz=1024)。
#
#  ⚠️ output0 的 dtype 是 **UINT8**（不是 float）：引擎内部已经做完
#     Resize + ArgMax + Cast，每个像素就是类别 id。所以 C++ 绑定这块内存时
#     必须用 u8 缓冲，不能再按 sizeof(float) 算。
#  后处理只剩反 letterbox：裁灰边 -> **nearest** 缩回原图（类别 id 不能用
#  bilinear 重采样，会造出不存在的类别）。
#
#  ⚠️ 本模型走的是"类别图"分支，不是 .pt 的"logits"分支。ultralytics
#     semantic/predict.py:67 自己分叉：
#         class_map_input = pred.ndim == 2   # 图里烘了 ArgMax 就发 [H,W]
#     引擎已经 argmax 完，只做 nearest 缩放；.pt 则是
#     「bilinear 上采样 -> scale_masks(bilinear) -> argmax」，算子顺序不同，
#     实测同一张图差 2.8%~18.5% 的像素。所以对拍基准必须是引擎/ONNX 路径
#     （见 D:\Data\trt_exp\dump_depth_sem_ref.py 与 test/test_yolov26_tasks 的 [10]），
#     拿 .pt 的 predict() 比会永远对不上。
#  另：.pt 还会走【矩形】letterbox（predictor.py:230），静态引擎只能正方形，
#     这也会额外引入差异。
#  实测 C++ vs 参考：8/8 张图逐像素 0 mismatch。
# =============================================================================

[model]
engine = engines/yolov26n_sem.trt
class_names_file = data/classes/cityscapes19.txt
# 注意：这里**不写 num_class** —— 语义分割的类别数来自 class_names_file 的行数，
# 本模型根本不读这个键（写上只会被配置框标成 [unused]，改了也没有任何效果）。

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
batch_size = 2
