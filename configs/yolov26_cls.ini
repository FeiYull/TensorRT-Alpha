# =============================================================================
#  trt_alpha :: yolov26_cls（图像分类）
# -----------------------------------------------------------------------------
#  引擎是外部导出的静态 ONNX（batch = 2，输入 3x640x640，输出 [2, 1000]）。
#  本仓库不存引擎文件，engines/ 下的名字只是约定；实际用 --engine 指过去：
#      D:\ThirdParty\TensorRT-10.16.1.11\bin\yolo26n-cls.trt
#
#  预处理：Pillow 口径 —— Resize(短边->224, PIL BILINEAR) -> CenterCrop(224)
#          -> BGR2RGB -> HWC2CHW -> /255。**不是 letterbox**。
#          几何由 torchvision 的 _compute_resized_output_size 决定：
#          长边用 int() 截断（实测 810x1080 -> 224x298，不是 299）。
#  后处理：引擎输出已含 Softmax，C++ 只需 top-k。
#
#  为什么是 224：
#      分类缩的是【短边】，224 与 640 是完全不同的输入。官方分类参考
#      sry_yolo26_cls.py 用 224，所以引擎必须按 224 导，否则两边永远对不上。
#      本文件对应的引擎 = engines/yolov26n_cls.trt（由 yolo26n-cls.onnx @224 构建）：
#          python sry_export.py --weights yolo26n-cls.pt --imgsz 224
#          trtexec --onnx=yolo26n-cls.onnx --saveEngine=yolov26n_cls.trt --noTF32
#
#  注意：[input] 里【不用】写 dst_h/dst_w —— 空间维一律以引擎声明形状为唯一真相源，
#        引擎是 3x224x224，模型就自动按 224 预处理。
# =============================================================================

[model]
engine = engines/yolov26n_cls.trt
class_names_file = data/classes/imagenet1000.txt
input_output_names = images,output0
num_class = 1000

[input]
# 静态引擎写死的 batch，必须与引擎一致（否则 init 直接报错，不静默钳制）。
batch_size = 2

[postprocess]
# 分类只取前 top_k 个类别。
top_k = 5
