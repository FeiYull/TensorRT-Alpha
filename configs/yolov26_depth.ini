# =============================================================================
#  trt_alpha :: yolov26_depth（单目深度估计）
# -----------------------------------------------------------------------------
#  引擎是外部导出的静态 ONNX（batch = 2，输入 3x768x768，输出 [2, 1, 768, 768]）。
#  本仓库不存引擎/权重（都被 gitignore），engines/ 下的名字只是约定：
#      onnx : E:\Code\ultralytics\yolo26n-depth.onnx    (imgsz = 768)
#      build: trtexec --onnx=yolo26n-depth.onnx \
#                     --saveEngine=engines/yolov26n_depth.trt --noTF32
#
#  768 是 yolo26n-depth.pt 的原生 imgsz。空间维**不写在本文件里** —— 只认引擎
#  声明形状。不写就一行日志都不会多；只有在 ini 里显式写了 input.dst_h / dst_w
#  且与引擎不符时，才会打一行
#      InputShape: config size 640x640 != engine declared shape,
#                  using engine shape (768x768)
#  这行 WARN 不是错误：引擎形状永远胜出（ADR-2）。
#
#  预处理：与检测完全相同的 letterbox（768x768，灰边 114，/255）。
#  后处理：引擎已经把 exp(clamp(-4,5)) + 标定 + 上采样全烘进图里，output0 实测
#          就是 [2,1,768,768] 的米制深度（0.71~31.5 m）——**C++ 侧不要再插一次
#          interpolate**。剩下的只有反 letterbox：裁掉灰边 -> bilinear
#          (align_corners=False) 缩回原图。深度图没有类别。
#
#  注意：参考脚本 sry_yolo26_depth.py 里有一步 F.interpolate，那是因为它直接跑
#  .pt 模型；ONNX 图已经包含这一步。照抄会多算一次。
#
#  ⚠️ 对拍别拿 .pt 的 predict() 当基准：ultralytics 的
#     engine/predictor.py:230  `auto = same_shapes and rect and
#     (model.format == "pt" or dynamic)` → .pt 走【矩形】letterbox
#     （1280x720 会变成 384x768），静态 onnx/engine 走【正方形】768x768。
#
#  ⚠️ 还有一处分叉是 **分辨率**：.pt 自带 imgsz=768，不显式传 imgsz 就在 768 上
#     推理。depth 头融合了 P3/P4/P5，内容周围留几行灰边会改变结果 ——
#     实测同一张图差到 25.4 m。py 侧对拍请写 model(..., rect=False, imgsz=768)。
#     引擎路径的基准要取 "onnxruntime(768x768) -> ops.scale_masks"（见
#     D:\Data\trt_exp\dump_depth_sem_ref.py 与 test/test_yolov26_tasks 的 [9]）。
#     实测 C++ vs 参考：max|d| <= 1.9e-4 m，mean|d| <= 5.5e-6 m。
# =============================================================================

[model]
engine = engines/yolov26n_depth.trt
class_names_file = data/classes/depth.txt
input_output_names = images,output0

[input]
batch_size = 2
