# =============================================================================
#  trt_alpha :: yolov11（目标检测）
# -----------------------------------------------------------------------------
#  引擎：engines/yolov11n.trt（yolo11n.onnx @640，静态 batch = 2）
#      yolo export model=yolo11n.pt format=onnx imgsz=640 batch=2 opset=17 simplify=True
#      trtexec --onnx=yolo11n.onnx --saveEngine=engines/yolov11n.trt --noTF32
#
#  和 yolov26 只差网络本身：导出口径一致（decode / *stride / sigmoid 都烘进图），
#  output0 = [batch, 4 + nc, anchors]，C++ 侧同样是 conf 过滤 + NMS +
#  scale_boxes，所以实现直接继承 YoloV26（见 src/det/yolov11.hpp）。
#
#  空间维不写在这里 —— 一律以引擎声明形状为唯一真相源；引擎是 640 就按 640
#  预处理，换成 1280 的引擎也不用改这个文件。
# =============================================================================

[model]
engine = engines/yolov11n.trt
class_names_file = data/classes/coco80.txt
num_class = 80

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
# 静态引擎写死的 batch，必须与引擎一致（不符直接报错，不静默钳制）。
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300
