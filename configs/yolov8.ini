# =============================================================================
#  trt_alpha :: yolov8（目标检测）
# -----------------------------------------------------------------------------
#  【新实现】走 YOLOV26 的 fused 前后处理（继承 YoloV26，只改标签）。
#  与 configs/yolov8_old.ini 消费同一个 ONNX 契约，但用的是【静态引擎】：
#  老的动态引擎已改名 engines/yolov8n_old.trt，两个实现可以直接 A/B 对拍。
#
#  引擎：engines/yolov8n.trt（静态 batch = 2，输入 3x640x640）
#      yolo export model=yolov8n.pt format=onnx imgsz=640 batch=2 opset=17
#      trtexec --onnx=yolov8n.onnx --saveEngine=engines/yolov8n.trt --noTF32
#
#  输出契约（与 yolov26/yolo11 逐项相同，实测确认）：
#      output0 [B, 4 + nc, anchors] = [B, 84, 8400]，box 是 xywh 像素，
#      cls 已 sigmoid。dist2bbox / *stride 都烘焙进图里了。
#
#  ⚠️ 分辨率：det 是 640。yolov8 家族各任务的原始分辨率并不同 ——
#      cls 224 / obb 1024 / det·seg·pose 640，别指望一个 imgsz 通吃。
# =============================================================================

[model]
engine = engines/yolov8n.trt
class_names_file = data/classes/coco80.txt
num_class = 80

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
# 静态引擎的 batch 已烘焙进图（导出 ONNX 时 batch=2），必须写对。
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300
