# =============================================================================
#  trt_alpha :: yolov8_obb（旋转框检测 / DOTA v1，nc = 15）
# -----------------------------------------------------------------------------
#  【新实现】走 YOLOV26 的 fused 前后处理（继承 YoloV26Obb）。
#
#  引擎：engines/yolov8n_obb.trt（静态 batch = 2，输入 3x1024x1024）
#      yolo export model=yolov8n-obb.pt format=onnx imgsz=1024 batch=2 opset=17
#      trtexec --onnx=yolov8n-obb.onnx --saveEngine=engines/yolov8n_obb.trt --noTF32
#
#  输出契约（实测与 yolo26n-obb.onnx 逐项相同）：
#      output0 [B, 20, 21504] = 4 + nc(15) + 1(angle)
#      angle = (sigmoid - 0.25) * pi，dist2rbox 已烘焙进图。
#
#  ⚠️ 分辨率：obb 是 1024（DOTA 训练口径），不是 640。
#  ⚠️ NMS 走 Fast-NMS(probiou)，不是贪心；由 YoloV26Obb 保证。
# =============================================================================

[model]
engine = engines/yolov8n_obb.trt
class_names_file = data/classes/dota15.txt
num_class = 15
# extra = 每 anchor 的额外通道。OBB 只有 1 个：旋转角。
#     4(xywh) + 15(cls) + 1(angle) = 20  <-- 与 ONNX 实测的通道数一致。
extra = 1

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
# 静态引擎的 batch，必须与引擎一致。
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300
