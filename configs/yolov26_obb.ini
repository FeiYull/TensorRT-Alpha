# =============================================================================
#  trt_alpha :: yolov26_obb（旋转框检测 / DOTA v1，nc = 15）
# -----------------------------------------------------------------------------
#  引擎是外部导出的静态 ONNX（batch = 2，输入 3x1024x1024，输出 [2, 20, 21504]）。
#  本仓库不存引擎/权重（都被 gitignore），engines/ 下的名字只是约定：
#      onnx : E:\Code\ultralytics\yolo26n-obb.onnx      (imgsz = 1024)
#      build: trtexec --onnx=yolo26n-obb.onnx \
#                     --saveEngine=engines/yolov26n_obb.trt --noTF32
#
#  1024 是 yolo26n-obb.pt 的原生 imgsz（DOTA 训练口径）。空间维**不写在本文件里**
#  —— 只认引擎声明形状。不写就一行日志都不会多；只有显式写了 input.dst_h / dst_w
#  且与引擎不符时，才会打一行
#      InputShape: config size 640x640 != engine declared shape,
#                  using engine shape (1024x1024)
#  这行 WARN 不是错误：引擎形状永远胜出（ADR-2）。
#
#  输出通道 = 4(xywh) + nc(15) + 1(angle) = 20，已烘焙 dist2rbox / *stride /
#  sigmoid。C++ 只剩：conf 过滤 + 坐标还原 + 旋转框 NMS。
#  anchors = 21 * (1024/32)^2 = 21504。
#
#  坐标还原（对齐官方 scale_boxes(..., xywh=True)）：
#      cx/cy 减去 letterbox 的 pad 再除以 gain；
#      w/h   只除以 gain；
#      xywh 分支**不做 clip**（只有 xyxy 分支才 clip）。
#
#  NMS 语义（对齐官方 DetectionPredictor: rotated=True）：
#      官方走 TorchNMS.fast_nms(iou_func=batch_probiou)，**不是贪心** ——
#      一个框存活，当且仅当没有任何更高分的框与它的 probiou >= iou_thresh。
#      这与本仓库 det 的融合后处理（轴对齐 xyxy 贪心）是两套语义，故单独开
#      算子族 postprocess_fused_yolov26_obb，不共用一个 flag 去切。
#
#  ⚠️ 对拍别拿 .pt 的 predict() 当基准，有两处分叉，都会让结果"看起来不对"：
#      1) letterbox：.pt 默认矩形（auto=True），引擎/ONNX 走正方形。
#      2) 分辨率：.pt 自带 imgsz=1024，调用时不显式传 imgsz 就在 1024 上推理。
#         py 侧对拍请写：
#             model(..., rect=False, imgsz=1024, conf=0.25, iou=0.7, max_det=300)
#         与引擎同分辨率后一致到 conf <=4e-6、centre <=1.3e-4 px、angle <=8.5e-7。
#  ⚠️ 引擎/ONNX 的基准由 D:\Data\trt_exp\dump_obb_ref.py 生成
#     （onnxruntime 正方形 letterbox -> nms.non_max_suppression(rotated=True) ->
#      ops.scale_boxes(..., xywh=True)），test/test_yolov26_tasks 的 [13] 逐框比对。
# =============================================================================

[model]
engine = engines/yolov26n_obb.trt
class_names_file = data/classes/dota15.txt
input_output_names = images,output0
num_class = 15
# extra = 每 anchor 的额外通道。OBB 只有 1 个：旋转角。所以
#     4(xywh) + 15(cls) + 1(angle) = 20  <-- 与 ONNX 实测的 output0 通道数一致。
extra = 1

[input]
# 输入逻辑维序：NCHW = [B, C, H, W]（yolo 系规范布局）。
layout = nchw
batch_size = 2

[postprocess]
conf_thresh = 0.25
iou_thresh = 0.7
top_k = 300
